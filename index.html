<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Allotment</title>
<style>
  :root {
    --ink: #241c14;
    --paper: #f3eee4;
    --gold: #e6c36a;
    --soil: #6d4b36;
    --danger: #c44b38;
    --leaf: #2f6a3c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #172016; color: var(--paper); }
  body { font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif; }
  button, .sans, a.ui { font-family: system-ui, sans-serif; }
  #app {
    max-width: 1040px;
    margin: 0 auto;
    padding: 22px 20px 32px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 18px;
  }
  #score {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  #coins {
    font-size: 64px;
    line-height: 0.8;
    letter-spacing: -0.045em;
  }
  #start-round[hidden] { display: none; }
  .kicker {
    font-family: system-ui, sans-serif;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.72;
  }
  #garden-col { display: flex; flex-direction: column; gap: 12px; }
  #request {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  #request[hidden] { display: none; }
  #request-side { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  #size {
    font-size: 64px;
    line-height: 0.8;
    letter-spacing: -0.045em;
  }
  #unit-row { display: flex; align-items: center; gap: 8px; }
  #timer {
    height: 14px;
    background: #455246;
    border-radius: 99px;
    overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(243, 238, 228, 0.28);
  }
  #timer[hidden] { display: none; }
  #timer-fill {
    height: 100%;
    width: 100%;
    background: var(--gold);
    transform-origin: left center;
    transform: scaleX(1);
  }
  #unit-label[hidden], #unit[hidden] { display: none; }
  #unit {
    width: 28px;
    height: 28px;
    background: #c4a574;
    border-radius: 3px;
    box-shadow: inset 0 0 0 1px rgba(255, 248, 230, 0.45);
  }
  #meta { text-align: right; line-height: 1.45; }
  #meta strong { font-weight: 500; }
  #board {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 14px;
    align-items: start;
  }
  #stage {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 8;
    border-radius: 18px;
    overflow: hidden;
    background: #121814;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    user-select: none;
    touch-action: none;
  }
  #stage.shake { animation: shake 0.35s linear; }
  @keyframes shake {
    20% { transform: translateX(-5px); }
    40% { transform: translateX(5px); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(2px); }
  }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  #toast {
    position: absolute;
    left: 50%;
    bottom: 16px;
    transform: translateX(-50%);
    background: rgba(36, 28, 20, 0.9);
    color: var(--paper);
    padding: 8px 12px;
    border-radius: 999px;
    font-family: system-ui, sans-serif;
    font-size: 14px;
    pointer-events: none;
  }
  #toast[hidden] { display: none; }
  .panel {
    background: var(--paper);
    color: var(--ink);
    border-radius: 22px;
    padding: 18px 18px 16px;
  }
  .panel h2 { font-weight: 500; letter-spacing: -0.03em; margin: 0 0 6px; font-size: 32px; }
  .panel p { line-height: 1.45; margin: 0 0 12px; }
  .shop-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
    border: 1px solid #e3d8c6;
    border-radius: 14px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .shop-row span { display: block; color: #5e5346; font-family: system-ui, sans-serif; font-size: 13px; margin-top: 2px; }
  #note { min-height: 1.3em; color: #8a3a2e; font-family: system-ui, sans-serif; font-size: 14px; }
  button {
    background: var(--paper);
    color: var(--ink);
    border: 0;
    border-radius: 999px;
    padding: 10px 16px;
    font-size: 15px;
    cursor: pointer;
    box-shadow: inset 0 0 0 1px #e3d8c6;
  }
  button:disabled { opacity: 0.4; cursor: default; }
  button.ghost { background: transparent; color: var(--paper); box-shadow: inset 0 0 0 1px rgba(243, 238, 228, 0.35); }
  .panel button.ghost { color: var(--ink); box-shadow: inset 0 0 0 1px #e3d8c6; }
  button.primary { background: var(--leaf); color: white; box-shadow: none; }
  .panel .primary { width: 100%; margin-top: 4px; }
  header .primary { width: auto; margin-top: 0; padding: 12px 18px; }
  #playbar {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  #playbar[hidden], #shop[hidden], #placer[hidden] { display: none; }
  #hint { margin: 0 8px; opacity: 0.75; font-family: system-ui, sans-serif; font-size: 14px; }
  #version, .doc-link { margin-left: auto; font-family: system-ui, sans-serif; font-size: 14px; }
  .doc-link { color: #5e5346; }
  #version { opacity: 0.55; color: var(--paper); }
  #playbar #version { margin-left: auto; }
  .footer-row { display: flex; align-items: center; margin-top: 12px; }
  @media (max-width: 800px) {
    header { align-items: flex-start; }
    #meta { text-align: left; }
    #score { flex-wrap: wrap; }
    #board { grid-template-columns: 1fr; }
    .shop-row { align-items: flex-start; flex-direction: column; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="score">
      <div>
        <div id="coins">0</div>
        <div class="kicker">coins</div>
      </div>
      <button id="start-round" class="primary" type="button">Start round</button>
    </div>
    <div id="meta"></div>
  </header>
  <div id="board">
  <div id="garden-col">
  <div id="stage">
    <canvas id="garden" width="1280" height="640"></canvas>
    <div id="toast" hidden></div>
  </div>
  <div id="request" hidden>
    <div id="size">0</div>
    <div id="request-side">
      <div class="kicker" id="size-label">units</div>
      <div id="timer" hidden aria-label="Time left"><div id="timer-fill"></div></div>
      <div id="unit-row">
        <div id="unit-label" class="kicker" hidden>One unit</div>
        <div id="unit" hidden></div>
      </div>
    </div>
  </div>
  </div>
  <div id="side">
  <section id="shop" class="panel">
    <div class="shop-row">
      <div>
        <strong>Hull</strong>
        <span id="hull-detail"></span>
      </div>
      <button id="buy-hull" type="button">25 coins</button>
    </div>
    <div class="shop-row">
      <div>
        <strong>Dirt</strong>
        <span id="dirt-detail"></span>
      </div>
      <button id="add-dirt" type="button">Add dirt</button>
    </div>
    <p id="note"></p>
    <div class="footer-row">
      <a class="doc-link" href="dev-ideas.html">Dev ideas</a>
    </div>
  </section>
  <section id="placer" class="panel" hidden>
    <p class="kicker">Dirt</p>
    <h2>Place a formation.</h2>
    <p>Drag across the dark ground. New squares have to touch the garden. The price is the next squares on the rising cost.</p>
    <p id="dirt-cost" class="sans"></p>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button id="confirm-dirt" class="primary" type="button" style="width:auto; flex:1;">Place</button>
      <button id="clear-dirt" class="ghost" type="button">Clear</button>
      <button id="cancel-dirt" class="ghost" type="button">Back</button>
    </div>
  </section>
  <div id="playbar" hidden>
    <button id="plant" type="button">Plant</button>
    <button id="clear" class="ghost" type="button">Clear</button>
    <p id="hint">Hover a square to mark it. Extra squares stay planted. Click harvest when it is ready.</p>
    <span id="version">v0.4.0</span>
  </div>
  </div>
  </div>
</div>
<script>
const VERSION = "0.4.0";
const COLS = 16;
const ROWS = 8;
const W = 1280;
const H = 640;
const CELL_W = W / COLS;
const CELL_H = H / ROWS;
const CELL_AREA = CELL_W * CELL_H;
const START_W = 16;
const START_H = 1;

const CROPS = [
  { name: "tomato", leaf: "#2f7a3e", fruit: "#e24b3a", bed: "#8a6248" },
  { name: "kale", leaf: "#1f8a45", fruit: "#b6e36a", bed: "#6d8a46" },
  { name: "sunflower", leaf: "#4f7a32", fruit: "#f2c14a", bed: "#a07840" },
  { name: "wheat", leaf: "#d8c27a", fruit: "#f4e7b0", bed: "#b08a48" },
  { name: "berry", leaf: "#2c6a48", fruit: "#c44b86", bed: "#7a5870" },
];

const view = document.getElementById("garden");
const ctx = view.getContext("2d");
const stage = document.getElementById("stage");
const soil = document.createElement("canvas");
soil.width = W;
soil.height = H;
const soilCtx = soil.getContext("2d");
const coinsEl = document.getElementById("coins");
const requestEl = document.getElementById("request");
const sizeEl = document.getElementById("size");
const sizeLabel = document.getElementById("size-label");
const timerEl = document.getElementById("timer");
const timerFill = document.getElementById("timer-fill");
const unitLabel = document.getElementById("unit-label");
const unitEl = document.getElementById("unit");
const metaEl = document.getElementById("meta");
const toastEl = document.getElementById("toast");
const hintEl = document.getElementById("hint");
const shopEl = document.getElementById("shop");
const placerEl = document.getElementById("placer");
const playbarEl = document.getElementById("playbar");
const noteEl = document.getElementById("note");
const buyHullBtn = document.getElementById("buy-hull");
const hullDetail = document.getElementById("hull-detail");
const HULL_COST = 25;
const addDirtBtn = document.getElementById("add-dirt");
const startBtn = document.getElementById("start-round");
const confirmBtn = document.getElementById("confirm-dirt");
const dirtCostEl = document.getElementById("dirt-cost");
const versionEl = document.getElementById("version");

versionEl.textContent = "v" + VERSION;

const state = {
  mode: "shop",
  round: 0,
  plantedThisRound: 0,
  coins: 0,
  hull: false,
  dirtBought: 0,
  dirt: new Uint8Array(COLS * ROWS),
  cells: new Array(COLS * ROWS).fill(0),
  plots: [],
  nextId: 1,
  request: null,
  flash: null,
  toast: 0,
  note: "",
  selection: new Set(),
  marks: new Set(),
  best: Number(localStorage.getItem("allotment-best") || 0),
};

let painting = false;
let pointer = null;
let lastMark = -1;
let placeAdding = true;

function buildSoil() {
  soilCtx.fillStyle = "#6d4b36";
  soilCtx.fillRect(0, 0, W, H);
  for (let i = 0; i < 1600; i++) {
    soilCtx.fillStyle = i % 2 ? "rgba(92, 58, 38, 0.35)" : "rgba(168, 116, 74, 0.2)";
    const x = Math.random() * W;
    const y = Math.random() * H;
    const rx = 2 + Math.random() * 16;
    soilCtx.beginPath();
    soilCtx.ellipse(x, y, rx, rx * (0.45 + Math.random() * 0.4), Math.random() * 3, 0, Math.PI * 2);
    soilCtx.fill();
  }
  const shade = soilCtx.createRadialGradient(W / 2, H / 2, W * 0.15, W / 2, H / 2, W * 0.72);
  shade.addColorStop(0, "rgba(0,0,0,0)");
  shade.addColorStop(1, "rgba(42, 24, 14, 0.38)");
  soilCtx.fillStyle = shade;
  soilCtx.fillRect(0, 0, W, H);
}

function initGarden() {
  state.dirt.fill(0);
  state.cells.fill(0);
  const c0 = ((COLS - START_W) / 2) | 0;
  const r0 = ((ROWS - START_H) / 2) | 0;
  for (let r = 0; r < START_H; r++) {
    for (let c = 0; c < START_W; c++) state.dirt[(r0 + r) * COLS + (c0 + c)] = 1;
  }
}

function neighbors(i) {
  const x = i % COLS;
  const y = (i / COLS) | 0;
  const out = [];
  if (x > 0) out.push(i - 1);
  if (x < COLS - 1) out.push(i + 1);
  if (y > 0) out.push(i - COLS);
  if (y < ROWS - 1) out.push(i + COLS);
  return out;
}

function cellAt(x, y) {
  const c = (x / CELL_W) | 0;
  const r = (y / CELL_H) | 0;
  if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return -1;
  return r * COLS + c;
}

function largestFreeComponent() {
  const seen = new Uint8Array(COLS * ROWS);
  let best = 0;
  for (let i = 0; i < state.cells.length; i++) {
    if (seen[i] || !state.dirt[i] || state.cells[i]) continue;
    let n = 0;
    const stack = [i];
    seen[i] = 1;
    while (stack.length) {
      const cur = stack.pop();
      n++;
      for (const nb of neighbors(cur)) {
        if (seen[nb] || !state.dirt[nb] || state.cells[nb]) continue;
        seen[nb] = 1;
        stack.push(nb);
      }
    }
    if (n > best) best = n;
  }
  return best;
}

function openDirtCount() {
  let n = 0;
  for (let i = 0; i < state.dirt.length; i++) if (!state.dirt[i]) n++;
  return n;
}

function dirtQuote(n) {
  const start = state.dirtBought + 1;
  let sum = 0;
  for (let i = 0; i < n; i++) sum += start + i;
  return sum;
}

function selectionAttached() {
  if (state.selection.size === 0) return false;
  const reached = new Set();
  const stack = [];
  for (let i = 0; i < state.dirt.length; i++) if (state.dirt[i]) stack.push(i);
  const seen = new Uint8Array(COLS * ROWS);
  while (stack.length) {
    const cur = stack.pop();
    for (const nb of neighbors(cur)) {
      if (seen[nb] || !state.selection.has(nb)) continue;
      seen[nb] = 1;
      reached.add(nb);
      stack.push(nb);
    }
  }
  return reached.size === state.selection.size;
}

function clearMarks() {
  state.marks.clear();
  lastMark = -1;
}

function markCell(index) {
  if (index < 0 || !state.dirt[index] || state.cells[index]) return;
  state.marks.add(index);
}

function markHover(index) {
  if (state.mode !== "play") return;
  if (lastMark >= 0 && index >= 0 && index !== lastMark) {
    const c0 = lastMark % COLS;
    const r0 = (lastMark / COLS) | 0;
    const c1 = index % COLS;
    const r1 = (index / COLS) | 0;
    const steps = Math.max(Math.abs(c1 - c0), Math.abs(r1 - r0));
    for (let i = 1; i <= steps; i++) {
      const c = Math.round(c0 + ((c1 - c0) * i) / steps);
      const r = Math.round(r0 + ((r1 - r0) * i) / steps);
      markCell(r * COLS + c);
    }
  } else {
    markCell(index);
  }
  if (index >= 0) lastMark = index;
}

function isConnected(cells) {
  if (cells.length === 0) return false;
  const set = new Set(cells);
  const stack = [cells[0]];
  const seen = new Set(stack);
  while (stack.length) {
    const cur = stack.pop();
    for (const nb of neighbors(cur)) {
      if (!set.has(nb) || seen.has(nb)) continue;
      seen.add(nb);
      stack.push(nb);
    }
  }
  return seen.size === cells.length;
}

function markedCells() {
  const chosen = new Set(state.marks);
  if (state.hull && chosen.size > 0) {
    const seen = new Uint8Array(COLS * ROWS);
    const stack = [];
    function push(i) {
      if (i < 0 || i >= COLS * ROWS || seen[i] || chosen.has(i)) return;
      seen[i] = 1;
      stack.push(i);
    }
    for (let c = 0; c < COLS; c++) {
      push(c);
      push((ROWS - 1) * COLS + c);
    }
    for (let r = 0; r < ROWS; r++) {
      push(r * COLS);
      push(r * COLS + COLS - 1);
    }
    while (stack.length) {
      const cur = stack.pop();
      for (const nb of neighbors(cur)) push(nb);
    }
    for (let i = 0; i < COLS * ROWS; i++) {
      if (!seen[i] && state.dirt[i] && !state.cells[i]) chosen.add(i);
    }
  }
  return [...chosen];
}

function rollSize() {
  return 1 + Math.floor(Math.random() * 10);
}

function requestTime() {
  const drop = state.plantedThisRound * 200 + Math.max(0, state.round - 1) * 250;
  return Math.max(7000, 10000 - drop);
}

function makeRequest() {
  const room = largestFreeComponent();
  if (room < 1) return null;
  const total = requestTime();
  return { size: rollSize(), remaining: total, total };
}

function spawnRequest() {
  const request = makeRequest();
  if (!request) {
    endRound("No room left.");
    return;
  }
  state.request = request;
}

function cropLife() {
  return (1 + Math.random() * 9) * 1000;
}

function notify(text) {
  toastEl.textContent = text;
  toastEl.hidden = false;
  state.toast = 1600;
}

function rememberBest() {
  if (state.plantedThisRound > state.best) {
    state.best = state.plantedThisRound;
    localStorage.setItem("allotment-best", String(state.best));
  }
}

function endRound(message) {
  if (state.mode !== "play") return;
  rememberBest();
  state.mode = "shop";
  state.request = null;
  state.note = message;
  state.plots = [];
  state.cells.fill(0);
  state.flash = null;
  clearMarks();
  stage.classList.add("shake");
}

function tickCrops(dt) {
  for (const plot of state.plots) {
    if (plot.life > 0) plot.life = Math.max(0, plot.life - dt);
  }
}

function plotAt(index) {
  if (index < 0) return null;
  const id = state.cells[index];
  if (!id) return null;
  for (const plot of state.plots) if (plot.id === id) return plot;
  return null;
}

function harvest(plot) {
  if (plot.life > 0) return;
  for (const ci of plot.cells) state.cells[ci] = 0;
  const at = state.plots.indexOf(plot);
  if (at >= 0) state.plots.splice(at, 1);
  state.coins += plot.reward;
  notify("+" + plot.reward + " coin" + (plot.reward === 1 ? "" : "s"));
}

function startRound() {
  if (state.mode !== "shop") return;
  if (largestFreeComponent() < 1) {
    state.note = "There's no open soil. Harvest a plant, or add dirt.";
    return;
  }
  state.round += 1;
  state.plantedThisRound = 0;
  state.note = "";
  state.mode = "play";
  clearMarks();
  spawnRequest();
}

function buyHull() {
  if (state.mode !== "shop" || state.hull || state.coins < HULL_COST) return;
  state.coins -= HULL_COST;
  state.hull = true;
}

function beginPlacement() {
  if (state.mode !== "shop" || openDirtCount() === 0) return;
  state.selection.clear();
  state.mode = "place";
}

function cancelPlacement() {
  state.selection.clear();
  state.mode = "shop";
}

function confirmPlacement() {
  if (state.mode !== "place") return;
  const n = state.selection.size;
  if (n === 0 || !selectionAttached()) return;
  const cost = dirtQuote(n);
  if (state.coins < cost) return;
  state.coins -= cost;
  for (const i of state.selection) state.dirt[i] = 1;
  state.dirtBought += n;
  state.selection.clear();
  state.mode = "shop";
  state.note = "";
}

function editSelection(index, add) {
  if (index < 0 || state.dirt[index]) return;
  if (add) state.selection.add(index);
  else state.selection.delete(index);
}

function submit() {
  if (state.mode !== "play" || !state.request) return;
  const chosen = markedCells();
  if (chosen.length === 0) return;
  if (chosen.length < state.request.size) {
    endRound("Too small.");
    return;
  }
  if (!isConnected(chosen)) {
    clearMarks();
    notify("A bed has to be one connected piece.");
    return;
  }
  const id = state.nextId++;
  const crop = CROPS[(id - 1) % CROPS.length];
  const life = cropLife();
  const reward = state.request.size;
  state.plots.push({ id, crop, life, max: life, cells: chosen, reward });
  for (const ci of chosen) state.cells[ci] = id;
  state.flash = { cells: chosen, life: 520 };
  clearMarks();
  state.plantedThisRound += 1;
  spawnRequest();
}

function update(dt) {
  if (state.toast > 0) {
    state.toast -= dt;
    if (state.toast <= 0) toastEl.hidden = true;
  }
  if (state.flash) {
    state.flash.life -= dt;
    if (state.flash.life <= 0) state.flash = null;
  }
  tickCrops(dt);
  if (state.mode !== "play" || !state.request) return;
  state.request.remaining -= dt;
  if (state.request.remaining <= 0) endRound("Time ran out.");
}

function drawRegion(cells, color, width) {
  const has = new Set(cells);
  ctx.beginPath();
  for (const ci of cells) {
    const x = (ci % COLS) * CELL_W;
    const y = ((ci / COLS) | 0) * CELL_H;
    const col = ci % COLS;
    const row = (ci / COLS) | 0;
    if (col === 0 || !has.has(ci - 1)) {
      ctx.moveTo(x, y);
      ctx.lineTo(x, y + CELL_H);
    }
    if (col === COLS - 1 || !has.has(ci + 1)) {
      ctx.moveTo(x + CELL_W, y);
      ctx.lineTo(x + CELL_W, y + CELL_H);
    }
    if (row === 0 || !has.has(ci - COLS)) {
      ctx.moveTo(x, y);
      ctx.lineTo(x + CELL_W, y);
    }
    if (row === ROWS - 1 || !has.has(ci + COLS)) {
      ctx.moveTo(x, y + CELL_H);
      ctx.lineTo(x + CELL_W, y + CELL_H);
    }
  }
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.stroke();
}

function drawPlot(plot) {
  let sx = 0;
  let sy = 0;
  const ready = plot.life <= 0;
  for (const ci of plot.cells) {
    const x = (ci % COLS) * CELL_W;
    const y = ((ci / COLS) | 0) * CELL_H;
    ctx.fillStyle = ready ? "#2f7a45" : "#1b3324";
    ctx.fillRect(x + 4, y + 4, CELL_W - 8, CELL_H - 8);
    ctx.strokeStyle = ready ? "#b6f0c4" : "#3f9a56";
    ctx.lineWidth = 3;
    ctx.strokeRect(x + 4.5, y + 4.5, CELL_W - 9, CELL_H - 9);
    sx += x + CELL_W / 2;
    sy += y + CELL_H / 2;
  }
  const cx = sx / plot.cells.length;
  const cy = sy / plot.cells.length;
  ctx.fillStyle = "#8ee7a8";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  const noun = plot.reward === 1 ? "coin" : "coins";
  if (ready) {
    ctx.font = "600 26px system-ui, sans-serif";
    ctx.fillText("harvest", cx, cy);
    return;
  }
  const seconds = Math.ceil(plot.life / 1000);
  const line = seconds + " sec for " + plot.reward + " " + noun;
  let minC = COLS;
  let maxC = 0;
  for (const ci of plot.cells) {
    const c = ci % COLS;
    if (c < minC) minC = c;
    if (c > maxC) maxC = c;
  }
  ctx.font = "600 22px system-ui, sans-serif";
  if (ctx.measureText(line).width <= (maxC - minC + 1) * CELL_W - 8) {
    ctx.fillText(line, cx, cy);
    return;
  }
  ctx.font = "600 18px system-ui, sans-serif";
  ctx.fillText(seconds + " sec for", cx, cy - 12);
  ctx.fillText(plot.reward + " " + noun, cx, cy + 12);
}

function draw() {
  ctx.fillStyle = "#121814";
  ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < state.dirt.length; i++) {
    if (!state.dirt[i]) continue;
    const x = (i % COLS) * CELL_W;
    const y = ((i / COLS) | 0) * CELL_H;
    ctx.drawImage(soil, x, y, CELL_W, CELL_H, x, y, CELL_W, CELL_H);
  }
  if (state.mode === "place") {
    ctx.save();
    ctx.strokeStyle = "rgba(243, 238, 228, 0.14)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let c = 1; c < COLS; c++) {
      ctx.moveTo(c * CELL_W + 0.5, 0);
      ctx.lineTo(c * CELL_W + 0.5, H);
    }
    for (let r = 1; r < ROWS; r++) {
      ctx.moveTo(0, r * CELL_H + 0.5);
      ctx.lineTo(W, r * CELL_H + 0.5);
    }
    ctx.stroke();
    ctx.restore();
    for (const i of state.selection) {
      const x = (i % COLS) * CELL_W;
      const y = ((i / COLS) | 0) * CELL_H;
      ctx.fillStyle = "rgba(214, 176, 112, 0.9)";
      ctx.fillRect(x + 3, y + 3, CELL_W - 6, CELL_H - 6);
    }
  }
  for (const plot of state.plots) drawPlot(plot);
  if (state.mode === "play") {
    const hover = pointer ? cellAt(pointer.x, pointer.y) : -1;
    for (const ci of markedCells()) {
      const x = (ci % COLS) * CELL_W;
      const y = ((ci / COLS) | 0) * CELL_H;
      ctx.fillStyle = ci === hover ? "rgba(255, 236, 176, 0.95)" : "rgba(244, 209, 115, 0.82)";
      ctx.fillRect(x + 3, y + 3, CELL_W - 6, CELL_H - 6);
    }
    if (hover >= 0 && state.dirt[hover] && !state.cells[hover] && !state.marks.has(hover)) {
      const x = (hover % COLS) * CELL_W;
      const y = ((hover / COLS) | 0) * CELL_H;
      ctx.fillStyle = "rgba(244, 209, 115, 0.45)";
      ctx.fillRect(x + 3, y + 3, CELL_W - 6, CELL_H - 6);
    }
  }
  if (state.flash) drawRegion(state.flash.cells, "rgba(255, 250, 235, 0.95)", 4);
}

function renderHud() {
  const playing = state.mode === "play" && state.request;
  shopEl.hidden = state.mode !== "shop";
  placerEl.hidden = state.mode !== "place";
  playbarEl.hidden = state.mode !== "play";
  startBtn.hidden = state.mode !== "shop";
  requestEl.hidden = !playing;
  timerEl.hidden = !playing;
  unitLabel.hidden = !playing;
  unitEl.hidden = !playing;
  coinsEl.textContent = String(state.coins);
  const underPointer = pointer && state.mode !== "place" ? plotAt(cellAt(pointer.x, pointer.y)) : null;
  view.style.cursor = state.mode === "place" ? "crosshair" : underPointer && underPointer.life <= 0 ? "pointer" : "default";

  if (playing) {
    sizeEl.textContent = String(state.request.size);
    sizeLabel.textContent = "units";
    const ratio = Math.max(0, state.request.remaining / state.request.total);
    timerFill.style.transform = "scaleX(" + ratio + ")";
    timerFill.style.background = ratio < 0.3 ? "#d4533c" : "#e6c36a";
    const side = stage.clientWidth / COLS;
    unitEl.style.width = side + "px";
    unitEl.style.height = (stage.clientHeight / ROWS) + "px";
  }

  hullDetail.textContent = state.hull
    ? "Owned. An outline fills in the squares inside it."
    : "Mark an outline. Squares inside it count as filled.";
  buyHullBtn.disabled = state.hull || state.coins < HULL_COST;
  buyHullBtn.textContent = state.hull ? "Owned" : HULL_COST + " coins";
  const nextDirt = dirtQuote(1);
  document.getElementById("dirt-detail").textContent =
    "Next square costs " + nextDirt + " coin" + (nextDirt === 1 ? "" : "s") +
    ". Place any shape that touches the garden. Each square costs one more.";
  addDirtBtn.disabled = openDirtCount() === 0;
  addDirtBtn.textContent = openDirtCount() === 0 ? "Garden full" : "Add dirt";
  startBtn.disabled = largestFreeComponent() < 1;
  noteEl.textContent = state.note;

  const n = state.selection.size;
  const attached = n > 0 && selectionAttached();
  const cost = n > 0 ? dirtQuote(n) : 0;
  const affordable = n > 0 && state.coins >= cost;
  confirmBtn.disabled = !attached || !affordable;
  if (n === 0) dirtCostEl.textContent = "No squares selected. The next square costs " + dirtQuote(1) + ".";
  else if (!attached) dirtCostEl.textContent = n + " selected, but they have to touch the garden.";
  else dirtCostEl.textContent = n + " square" + (n === 1 ? "" : "s") + " · " + cost + " coins" + (affordable ? "" : " — you have " + state.coins);

  metaEl.innerHTML =
    "<strong>" + (state.round ? "Round " + state.round : "Shop") + "</strong><br>" +
    (state.hull ? "Hull<br>" : "") +
    state.coins + " coins" +
    (state.best ? "<br>Best " + state.best : "");
  if (state.mode === "play") {
    hintEl.textContent = "Hover a square to mark it. Extra squares stay planted. Click harvest when it is ready.";
  }
}

function pointerPos(event) {
  const rect = view.getBoundingClientRect();
  return {
    x: (event.clientX - rect.left) * (W / rect.width),
    y: (event.clientY - rect.top) * (H / rect.height),
  };
}

view.addEventListener("pointerdown", (event) => {
  pointer = pointerPos(event);
  if (event.button === 2) {
    if (state.mode === "play") clearMarks();
    if (state.mode === "place") editSelection(cellAt(pointer.x, pointer.y), false);
    return;
  }
  if (event.button !== 0) return;
  const under = plotAt(cellAt(pointer.x, pointer.y));
  if (under && state.mode !== "place") {
    if (under.life <= 0) harvest(under);
    return;
  }
  if (state.mode === "play") return;
  if (state.mode === "place") {
    view.setPointerCapture(event.pointerId);
    painting = true;
    const index = cellAt(pointer.x, pointer.y);
    placeAdding = index < 0 || !state.selection.has(index);
    editSelection(index, placeAdding);
  }
});

view.addEventListener("pointermove", (event) => {
  pointer = pointerPos(event);
  if (state.mode === "play") markHover(cellAt(pointer.x, pointer.y));
  if (state.mode === "place" && painting) editSelection(cellAt(pointer.x, pointer.y), placeAdding);
});

view.addEventListener("pointerup", () => {
  if (state.mode === "place") painting = false;
});

view.addEventListener("pointerleave", () => {
  pointer = null;
  lastMark = -1;
});

view.addEventListener("contextmenu", (event) => event.preventDefault());

document.getElementById("plant").addEventListener("click", submit);
document.getElementById("clear").addEventListener("click", clearMarks);
buyHullBtn.addEventListener("click", buyHull);
addDirtBtn.addEventListener("click", beginPlacement);
startBtn.addEventListener("click", startRound);
confirmBtn.addEventListener("click", confirmPlacement);
document.getElementById("clear-dirt").addEventListener("click", () => state.selection.clear());
document.getElementById("cancel-dirt").addEventListener("click", cancelPlacement);

window.addEventListener("keydown", (event) => {
  if (event.key === "Enter") {
    if (state.mode === "play") {
      event.preventDefault();
      submit();
      return;
    }
    if (event.target.closest("a, button")) return;
    event.preventDefault();
    if (state.mode === "shop") startRound();
    else if (state.mode === "place") confirmPlacement();
  }
  if (event.key === "Escape") {
    if (state.mode === "play") clearMarks();
    if (state.mode === "place") cancelPlacement();
  }
  if (event.key === "Backspace" && state.mode === "play") clearMarks();
});

stage.addEventListener("animationend", () => stage.classList.remove("shake"));

let last = performance.now();
function frame(now) {
  const dt = Math.min(50, now - last);
  last = now;
  update(dt);
  draw();
  renderHud();
  requestAnimationFrame(frame);
}

buildSoil();
initGarden();
requestAnimationFrame(frame);
</script>
</body>
</html>
